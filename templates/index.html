<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSA Sentiment Intelligence</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --border-color: #334155;
            --positive-color: #22c55e;
            --neutral-color: #eab308;
            --negative-color: #ef4444;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        .theme-toggle { cursor: pointer; padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-weight: bold; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text-muted); }
        input[type="text"], select, textarea { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 14px; }
        .voice-controls { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .btn { padding: 10px 20px; background: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: var(--border-color); color: var(--text-color); }
        
        /* Breakdown Grid */
        .breakdown-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
        .breakdown-box { background: var(--bg-color); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; }
        .breakdown-box.pos { border-top: 4px solid var(--positive-color); }
        .breakdown-box.neu { border-top: 4px solid var(--neutral-color); }
        .breakdown-box.neg { border-top: 4px solid var(--negative-color); }
        
        .styled-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .styled-table th, .styled-table td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        .styled-table th { background: var(--bg-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📱 ABSA Sentiment Intelligence</h2>
        <button class="theme-toggle" onclick="toggleTheme()">🌗 Dark/Light Mode</button>
    </div>

    <!-- Single Review Analysis -->
    <div class="card">
        <h3>Single Review Analysis</h3>
        <form id="predictionForm">
            <div class="form-group">
                <label>App Name</label>
                <input type="text" name="app_name" placeholder="e.g. Duolingo">
            </div>
            <div class="form-group">
                <label>Aspect Category</label>
                <select name="aspect">
                    <option value="UI / Ease of Use">UI / Ease of Use</option>
                    <option value="Ads / Premium / Subscription">Ads / Premium / Subscription</option>
                    <option value="Learning Content & Quality">Learning Content & Quality</option>
                    <option value="Speaking & Pronunciation">Speaking & Pronunciation</option>
                    <option value="Performance & Stability">Performance & Stability</option>
                    <option value="Grammar & Vocabulary">Grammar & Vocabulary</option>
                </select>
            </div>
            <div class="form-group">
                <label>User Review</label>
                <textarea id="reviewInput" name="review" rows="4" placeholder="Type or use voice input..." required></textarea>
            </div>
            
            <div class="voice-controls">
                <button type="button" class="btn btn-secondary" onclick="startSpeechRecognition()">🎤 Speak</button>
                <label><input type="checkbox" id="autoVoiceToggle" checked> 🔊 Auto Voice Reply Result</label>
            </div>

            <button type="submit" class="btn">Analyze Sentiment</button>
        </form>

        <!-- Single Result Section -->
        <div id="singleResult" style="margin-top: 20px; display: none;">
            <hr style="border-color: var(--border-color);">
            <h4>Result: <span id="resultSentiment" style="color: var(--accent-color);">-</span></h4>
            <p>Confidence: <strong id="resultConfidence">-%</strong></p>
            <button type="button" id="listenResultBtn" class="btn btn-secondary">🔊 Listen Result</button>

            <!-- Breakdown Percentages -->
            <div class="breakdown-grid">
                <div class="breakdown-box pos">
                    <label>Positive</label>
                    <h3 id="posPercent">-%</h3>
                </div>
                <div class="breakdown-box neu">
                    <label>Neutral</label>
                    <h3 id="neuPercent">-%</h3>
                </div>
                <div class="breakdown-box neg">
                    <label>Negative</label>
                    <h3 id="negPercent">-%</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Dataset Upload -->
    <div class="card">
        <h3>Bulk Dataset Upload (CSV/XLSX)</h3>
        <form id="fileForm">
            <div class="form-group">
                <input type="file" id="fileInput" name="file" accept=".csv, .xlsx, .xls" required>
            </div>
            <button type="submit" class="btn">Process Dataset</button>
        </form>
        <div id="fileResult" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    // Theme Toggle
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', targetTheme);
    }

    // --- Voice Output (Text to Speech) ---
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            utterance.lang = 'en-US';

            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                let englishVoice = voices.find(v => v.lang.includes('en'));
                if (englishVoice) utterance.voice = englishVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            alert("Speech synthesis is not supported in your browser.");
        }
    }

    // Load voices on setup
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    // --- Voice Input (Speech to Text) ---
    function startSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser. Try Chrome or Edge over HTTPS.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = function() {
            document.getElementById('reviewInput').placeholder = "Listening... Speak now...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('reviewInput').value = transcript;
            document.getElementById('reviewInput').placeholder = "Type or use voice input...";
        };

        recognition.onerror = function(event) {
            alert("Speech recognition error: " + event.error);
            document.getElementById('reviewInput').placeholder = "Type or use voice input...";
        };

        recognition.start();
    }

    // --- Single Review Submit Logic ---
    document.getElementById('predictionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);

        fetch('/predict', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if(data.error) {
                alert(data.error);
                return;
            }

            document.getElementById('singleResult').style.display = 'block';
            document.getElementById('resultSentiment').innerText = data.sentiment;
            document.getElementById('resultConfidence').innerText = data.confidence + '%';

            if(data.breakdown) {
                document.getElementById('posPercent').innerText = data.breakdown.Positive + '%';
                document.getElementById('neuPercent').innerText = data.breakdown.Neutral + '%';
                document.getElementById('negPercent').innerText = data.breakdown.Negative + '%';
            }

            // Auto Voice Reply
            if (document.getElementById('autoVoiceToggle').checked) {
                const speechMsg = `The predicted sentiment is ${data.sentiment} with a confidence of ${data.confidence} percent.`;
                speakText(speechMsg);
            }
        })
        .catch(err => console.error(err));
    });

    // Listen Result Button Click
    document.getElementById('listenResultBtn').addEventListener('click', function() {
        const sentiment = document.getElementById('resultSentiment').innerText;
        const confidence = document.getElementById('resultConfidence').innerText;
        if(sentiment && sentiment !== '-') {
            speakText(`The result is ${sentiment} with ${confidence} confidence.`);
        }
    });

    // --- File Processing Submit Logic ---
    document.getElementById('fileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData();
        const fileInput = document.getElementById('fileInput');
        formData.append('file', fileInput.files[0]);

        const resultDiv = document.getElementById('fileResult');
        resultDiv.innerHTML = "<p>Processing file... Please wait.</p>";

        fetch('/predict-file', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if(data.error) {
                resultDiv.innerHTML = `<p style="color:var(--negative-color)">${data.error}</p>`;
                return;
            }

            resultDiv.innerHTML = `
                <h4>Processed ${data.total_rows} Rows</h4>
                <p>Summary: Positive (${data.summary.Positive}), Neutral (${data.summary.Neutral}), Negative (${data.summary.Negative})</p>
                <div>${data.table_html}</div>
            `;
        })
        .catch(err => {
            resultDiv.innerHTML = "<p style='color:var(--negative-color)'>File processing error occurred.</p>";
        });
    });
</script>

</body>
</html>
