<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Aspect Sentiment Dashboard</title>
    <!-- Chart.js CDN for Analytics Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --voice-btn: #10B981;
        }

        .dark-mode {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3d;
            --text-color: #f1f1f1;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 20px auto;
        }

        .toggle-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: bold;
            border-radius: 6px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .textarea-wrapper {
            position: relative;
        }

        .voice-input-btn {
            position: absolute;
            right: 10px;
            bottom: 12px;
            background: var(--voice-btn);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .voice-input-btn.listening {
            background: #EF4444;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: rgba(0,0,0,0.03);
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speak-btn {
            background: #2563EB;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .bar-container { background: #e0e0e0; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .bar { height: 18px; text-align: right; padding-right: 5px; color: white; font-size: 12px; line-height: 18px; }
        .bg-pos { background-color: #10B981; }
        .bg-neu { background-color: #F59E0B; }
        .bg-neg { background-color: #EF4444; }

        .chart-box { max-width: 350px; margin: 20px auto; }
        .styled-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .styled-table th, .styled-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .styled-table th { background-color: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="header-bar">
    <h2>📱 ABSA Sentiment Intelligence</h2>
    <button class="toggle-btn" onclick="toggleDarkMode()">🌗 Dark/Light Mode</button>
</div>

<div class="container">
    <!-- Tabs Header -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('single')">Single Review Analysis</button>
        <button class="tab-btn" onclick="switchTab('bulk')">Bulk Dataset Upload (CSV/XLSX)</button>
    </div>

    <!-- TAB 1: SINGLE PREDICTION -->
    <div id="single" class="tab-content active">
        <label>App Name</label>
        <input type="text" id="appName" placeholder="e.g. Duolingo">

        <label>Aspect Category</label>
        <select id="aspect">
            <option>UI / Ease of Use</option>
            <option>Ads / Premium / Subscription</option>
            <option>Learning Content & Quality</option>
            <option>Speaking & Pronunciation</option>
            <option>Performance & Stability</option>
            <option>Grammar & Vocabulary</option>
        </select>

        <label>User Review</label>
        <div class="textarea-wrapper">
            <textarea id="review" rows="3" placeholder="Type or click microphone to speak..."></textarea>
            <button id="micBtn" class="voice-input-btn" onclick="startVoiceInput()">🎤 Speak</button>
        </div>

        <div style="margin-top: 10px;">
            <input type="checkbox" id="autoSpeak" style="width: auto;">
            <label for="autoSpeak" style="display: inline; font-weight: normal; font-size: 14px;">🔊 Auto Voice Reply Result</label>
        </div>

        <button class="btn-submit" onclick="analyzeSingle()">Analyze Sentiment</button>

        <div id="singleResult" class="result-box">
            <div class="result-header">
                <h3>Result: <span id="mainSentiment"></span></h3>
                <button class="speak-btn" onclick="speakResult()">🔊 Listen Result</button>
            </div>
            <p>Confidence: <strong id="mainConfidence"></strong>%</p>
            <hr>
            <div>Positive: <span id="posVal"></span>%</div>
            <div class="bar-container"><div id="posBar" class="bar bg-pos" style="width:0%"></div></div>

            <div style="margin-top:10px;">Neutral: <span id="neuVal"></span>%</div>
            <div class="bar-container"><div id="neuBar" class="bar bg-neu" style="width:0%"></div></div>

            <div style="margin-top:10px;">Negative: <span id="negVal"></span>%</div>
            <div class="bar-container"><div id="negBar" class="bar bg-neg" style="width:0%"></div></div>
        </div>
    </div>

    <!-- TAB 2: BULK FILE UPLOAD & ANALYTICS DASHBOARD -->
    <div id="bulk" class="tab-content">
        <label>Upload Dataset File (.csv, .xlsx)</label>
        <input type="file" id="fileInput" accept=".csv, .xlsx">
        <p style="font-size: 12px; color: #777;">* Upload any CSV or Excel file containing review data.</p>

        <button class="btn-submit" onclick="uploadFile()">Process & Generate Analytics</button>

        <div id="bulkResult" class="result-box">
            <h3>📊 Bulk Processing Overview</h3>
            <p>Total Reviews Evaluated: <strong id="totalRows"></strong></p>
            
            <div class="chart-box">
                <canvas id="sentimentChart"></canvas>
            </div>

            <h4>Preview (Top 10 Records):</h4>
            <div id="tableContainer" style="overflow-x:auto;"></div>
        </div>
    </div>
</div>

<script>
let chartInstance = null;
let currentResultText = "";

// --- Voice Recognition (Speech to Text) ---
function startVoiceInput() {
    const micBtn = document.getElementById('micBtn');
    const reviewBox = document.getElementById('review');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Sorry, your browser does not support Speech Recognition. Please use Google Chrome or Edge.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onstart = function() {
        micBtn.classList.add('listening');
        micBtn.innerHTML = "🔴 Listening...";
    };

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        reviewBox.value = transcript;
    };

    recognition.onerror = function(event) {
        alert("Voice Input Error: " + event.error);
    };

    recognition.onend = function() {
        micBtn.classList.remove('listening');
        micBtn.innerHTML = "🎤 Speak";
    };

    recognition.start();
}

// --- Text to Speech (Voice Reply) ---
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    } else {
        alert("Sorry, your browser does not support Voice Reply.");
    }
}

function speakResult() {
    if (currentResultText) {
        speakText(currentResultText);
    }
}

// Tab Switching
function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabId === 'single') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
    document.getElementById(tabId).classList.add('active');
}

// Dark Mode Toggler
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
}

// Single Review Prediction
async function analyzeSingle() {
    const formData = new FormData();
    formData.append('app_name', document.getElementById('appName').value);
    formData.append('aspect', document.getElementById('aspect').value);
    formData.append('review', document.getElementById('review').value);

    const res = await fetch('/predict', { method: 'POST', body: formData });
    const data = await res.json();

    document.getElementById('singleResult').style.display = 'block';
    document.getElementById('mainSentiment').innerText = data.sentiment;
    document.getElementById('mainConfidence').innerText = data.confidence;

    document.getElementById('posVal').innerText = data.breakdown.Positive;
    document.getElementById('posBar').style.width = data.breakdown.Positive + '%';

    document.getElementById('neuVal').innerText = data.breakdown.Neutral;
    document.getElementById('neuBar').style.width = data.breakdown.Neutral + '%';

    document.getElementById('negVal').innerText = data.breakdown.Negative;
    document.getElementById('negBar').style.width = data.breakdown.Negative + '%';

    currentResultText = `The predicted sentiment is ${data.sentiment} with a confidence of ${data.confidence} percent.`;

    if (document.getElementById('autoSpeak').checked) {
        speakResult();
    }
}

// Bulk File Upload & Chart Generation
async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    if (fileInput.files.length === 0) {
        alert("Please select a file first!");
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    const res = await fetch('/predict-file', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    document.getElementById('bulkResult').style.display = 'block';
    document.getElementById('totalRows').innerText = data.total_rows;
    document.getElementById('tableContainer').innerHTML = data.table_html;

    // Render Pie Chart
    const ctx = document.getElementById('sentimentChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Positive', 'Neutral', 'Negative'],
            datasets: [{
                data: [data.summary.Positive, data.summary.Neutral, data.summary.Negative],
                backgroundColor: ['#10B981', '#F59E0B', '#EF4444']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
}
</script>
</body>
</html>
